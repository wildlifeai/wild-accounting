<script>
  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  function fmtMoney(n) {
    return '$' + (Number(n) || 0).toLocaleString('en-NZ', { maximumFractionDigits: 0 });
  }
  function fmtMonthKey(key) {
    if (!key) return '';
    var p = key.split('-');
    return MONTHS[parseInt(p[1], 10) - 1] + ' ' + p[0];
  }
  // Every date on the page is a calendar date in the script's zone. Read in the browser's
  // own zone, midnight 1 April in Auckland is 31 March, so the FY read "Mar 2026 - Feb 2027".
  var TZ = 'Pacific/Auckland';
  function zoned(iso, opts) {
    var o = { timeZone: TZ };
    Object.keys(opts).forEach(function (k) { o[k] = opts[k]; });
    var parts = {};
    new Intl.DateTimeFormat('en-GB', o).formatToParts(new Date(iso))
      .forEach(function (p) { parts[p.type] = p.value; });
    return parts;
  }
  // "30 Sep 2026, 9:14 am": an age such as "1m ago" goes stale on a page left open.
  function syncedAt(iso) {
    var p = zoned(iso, { day: 'numeric', month: 'numeric', year: 'numeric',
      hour: 'numeric', minute: '2-digit', hour12: true });
    return p.day + ' ' + MONTHS[parseInt(p.month, 10) - 1] + ' ' + p.year + ', ' +
      p.hour + ':' + p.minute + ' ' + String(p.dayPeriod || '').toLowerCase();
  }
  var snapshot = null;

  function render(s) {
    snapshot = s;
    if (s.coverage && s.coverage.timeZone) TZ = s.coverage.timeZone;
    var syncText = 'synced ' + syncedAt(s.generatedAt);
    if (s._accessLevel && s._accessLevel !== 'admin') syncText += ' (' + s._accessLevel + ')';
    document.getElementById('sync-label').textContent = syncText;

    var warn = document.getElementById('xero-warning');
    if (s.xeroConnected) { warn.classList.add('hidden'); }
    else {
      warn.classList.remove('hidden');
      google.script.run.withSuccessHandler(function (st) {
        if (st.authUrl) document.getElementById('xero-link').href = st.authUrl;
      }).apiXeroStatus();
    }

    buildFySelector(s);
    buildFilters();
    renderOverview();
    // Follows show and filter, not the year: runway always runs from today.
    renderRunway();

    renderHealth(s.health || []);
  }

  // Health findings: what is wrong, where, and what to do about it. Sorted by
  // severity then by value at risk, so a large misattribution outranks a missing
  // description. See docs/HEALTH_CHECKS.md.
  function renderHealth(health) {
    var el = document.getElementById('flags');
    var badge = document.getElementById('health-badge');

    var counts = { error: 0, warning: 0, info: 0 };
    health.forEach(function (f) { counts[f.severity] = (counts[f.severity] || 0) + 1; });

    // Health lives behind a tab now, so the badge is what tells you to look. Errors
    // outrank warnings; info is never badged because nothing is wrong yet.
    if (badge) {
      var n = counts.error || counts.warning;
      badge.textContent = n ? String(n) : '';
      badge.className = 'badge' + (n ? (counts.error ? ' badge-error' : ' badge-warning')
                                     : ' hidden');
    }

    if (!health.length) {
      el.innerHTML = '<div class="health-sum">Nothing to report. Every sheet parsed and ' +
        'every actual line is tagged.</div>';
      return;
    }

    var parts = [];
    if (counts.error) parts.push('<b>' + counts.error + (counts.error === 1 ? ' error' : ' errors') + '</b>');
    if (counts.warning) parts.push(counts.warning + (counts.warning === 1 ? ' warning' : ' warnings'));
    if (counts.info) parts.push(counts.info + ' info');
    var html = '<div class="health-sum">Health: ' + parts.join(' · ') + '</div>';

    health.forEach(function (f) {
      if (f.severity === 'info') return;
      var where = [];
      if (f.fundingSource) where.push(f.fundingSource);
      if (f.row) where.push('row ' + f.row);
      html += '<div class="health-row health-' + esc(f.severity) + '">' +
        '<span class="health-title">' + esc(f.title) + '</span>' +
        (where.length ? '<span class="health-where">' + esc(where.join(' · ')) + '</span>' : '') +
        (f.amount ? '<span class="health-amt">' + fmtMoney(f.amount) + '</span>' : '') +
        (f.detail ? '<div class="health-detail">' + esc(f.detail) + '</div>' : '') +
        healthLines(f) +
        (f.action ? '<div class="health-action">' + esc(f.action) + '</div>' : '') +
        (f.link ? '<div><a class="health-link" target="_blank" rel="noopener" href="' +
          esc(f.link) + '">open sheet</a></div>' : '') +
        '</div>';
    });

    health.forEach(function (f) {
      if (f.severity === 'info' && f.detail) {
        html += '<div class="health-info">' + esc(f.detail) + healthLines(f) + '</div>';
      }
    });
    el.innerHTML = html;
  }

  // The Xero lines behind a finding, largest first, so each can be found and fixed in
  // Xero. Cents shown: a small fee is found by its exact amount.
  function healthLines(f) {
    if (!f.lines || !f.lines.length) return '';
    var n = f.lines.length + (f.moreLines || 0);
    var cents = function (v) {
      return '$' + (Number(v) || 0).toLocaleString('en-NZ',
        { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    };
    var rows = f.lines.map(function (l) {
      return '<tr><td>' + esc(l.date) + '</td><td>' + esc(l.document) + '</td><td>' +
        esc(l.contact) + '</td><td>' + esc(l.description) + '</td><td>' + esc(l.account) +
        '</td><td>' + esc(l.fundingSource) + '</td><td class="num">' + cents(l.amount) +
        '</td></tr>';
    }).join('');
    return '<details class="health-lines"><summary>' +
      (n === 1 ? 'Show the line' : 'Show the ' + n + ' lines') + '</summary>' +
      '<div class="table-wrap"><table><thead><tr><th>Date</th><th>Document</th>' +
      '<th>Contact</th><th>Description</th><th>Account</th><th>Funding source</th>' +
      '<th class="num">Amount</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
      (f.moreLines ? '<div class="health-more">and ' + f.moreLines +
        ' smaller line(s) not listed</div>' : '') +
      '</details>';
  }

  function selectedStatuses() {
    return Array.prototype.slice.call(document.querySelectorAll('.bd-status:checked'))
      .map(function (c) { return c.value; });
  }

  function distinct(rows, field) {
    var seen = {};
    rows.forEach(function (r) { seen[r[field]] = true; });
    return Object.keys(seen).sort();
  }

  // Populate the Project / Funding-source filter dropdowns from the data, preserving any
  // selections the user already made. Runway parts add what only actuals name, such as
  // spend tagged to a source with no sheet, so the filters can reach every line drawn.
  function buildFilters() {
    var rows = (snapshot.breakdownRows || [])
      .concat((snapshot.runway && snapshot.runway.parts) || []);
    fillFilter('filter-projects', distinct(rows, 'project'));
    fillFilter('filter-sources', distinct(rows, 'fundingSource'));
  }

  function fillFilter(id, values) {
    var box = document.getElementById(id);
    var prev = {};
    Array.prototype.slice.call(box.querySelectorAll('input'))
      .forEach(function (i) { prev[i.value] = i.checked; });
    box.innerHTML = values.map(function (v) {
      var checked = (v in prev) ? prev[v] : true;
      return '<label><input type="checkbox" value="' + esc(v) + '"' +
        (checked ? ' checked' : '') + '> ' + esc(v) + '</label>';
    }).join('');
    Array.prototype.slice.call(box.querySelectorAll('input')).forEach(function (i) {
      i.addEventListener('change', function () { updateFilterSummary(id); rerenderFor(id); });
    });
    updateFilterSummary(id);
  }

  // Filter lists are shared markup, so which view a change re-renders depends on the
  // list's id rather than being hardcoded. Without this the tracking tab's filters would
  // silently re-render the Overview instead.
  function rerenderFor(id) {
    if (id === 'tr-sources' || id === 'tr-milestones') renderTracking();
    else { renderOverview(); renderRunway(); }
  }

  var FILTER_NAMES = { 'filter-projects': 'Projects', 'filter-sources': 'Funding sources',
    'tr-sources': 'Funding sources', 'tr-milestones': 'Milestones' };

  function updateFilterSummary(id) {
    var box = document.getElementById(id);
    var all = box.querySelectorAll('input');
    var on = box.querySelectorAll('input:checked');
    var sum = document.getElementById(id + '-sum');
    var base = FILTER_NAMES[id];
    sum.textContent = (on.length === all.length)
      ? base + ' (all)' : base + ' (' + on.length + '/' + all.length + ')';
  }

  function selectedValues(id) {
    return Array.prototype.slice.call(document.querySelectorAll('#' + id + ' input:checked'))
      .map(function (c) { return c.value; });
  }

  // ---- Financial-year scope -----------------------------------------------
  // Quarter labels are "26/27 Q2", so the FY is everything before the space. The client
  // totals whichever quarters belong to the selected year, which is why the snapshot
  // carries per-quarter buckets rather than a single pre-computed "current FY" figure.

  function fyOf(quarterLabel) { return String(quarterLabel).split(' ')[0]; }

  // The selector is created once and kept, rather than rebuilt from markup on each
  // render: rebuilding it would drop the user's choice and its change listener.
  var fySelect = null;
  var fyChosen = false; // true once the user picks a year; until then, the current FY

  var fyYears = []; // the years the selector lists, the current FY onwards

  function fySelectEl() {
    if (!fySelect) {
      fySelect = document.createElement('select');
      fySelect.id = 'bd-fy';
      fySelect.className = 'dd-select';
      fySelect.setAttribute('aria-label', 'Financial year');
      // Changing the year only re-totals per-quarter buckets already in the snapshot,
      // so no server round trip is needed.
      fySelect.addEventListener('change', function () { fyChosen = true; renderOverview(); });
      document.getElementById('fy-slot').appendChild(fySelect);
    }
    return fySelect;
  }

  // The years the cards total: one, or every year the selector lists.
  function selectedFys() {
    var v = fySelect ? fySelect.value : 'all';
    return v === 'all' ? fyYears : [v];
  }

  // "26/27", "26/27 and 27/28", "26/27 to 28/29".
  function fysLabel(fys) {
    if (fys.length <= 1) return fys[0] || '';
    if (fys.length === 2) return fys.join(' and ');
    return fys[0] + ' to ' + fys[fys.length - 1];
  }

  function sumFys(byQuarter, fys) {
    var total = 0;
    Object.keys(byQuarter || {}).forEach(function (q) {
      if (fys.indexOf(fyOf(q)) !== -1) total += byQuarter[q];
    });
    return total;
  }

  /**
   * Populate the selector from the quarters the snapshot covers, the current FY onwards:
   * each year on its own, and when there is more than one, all of them together. A
   * finished year answers nothing the Overview is for. Labels are "26/27", so they order
   * as strings.
   */
  function buildFySelector(snap) {
    var sel = fySelectEl();
    var current = fyOf(snap.currentQuarter || '');
    var years = [];
    (snap.quarters || []).forEach(function (q) {
      var fy = fyOf(q);
      if (fy >= current && years.indexOf(fy) === -1) years.push(fy);
    });
    fyYears = years;
    var keep = sel.value;
    sel.innerHTML = years.map(function (y) {
        return '<option value="' + esc(y) + '">' + esc(y) + ' Financial year</option>';
      }).join('') +
      (years.length > 1
        ? '<option value="all">' + esc(fysLabel(years)) + ' Financial years</option>' : '');
    // Keep a year the user picked across refreshes; otherwise the current FY, or the
    // earliest year to come if the current one has nothing in it.
    if (fyChosen && ((keep === 'all' && years.length > 1) || years.indexOf(keep) !== -1)) sel.value = keep;
    else if (years.indexOf(current) !== -1) sel.value = current;
    else if (years.length) sel.value = years[0];
  }

  // The Overview cards: totals for the chosen years over whatever show and filter
  // select, from the snapshot's per-quarter breakdown rows.
  function renderOverview() {
    if (!snapshot) return;
    var fys = selectedFys();
    var fy = fysLabel(fys);
    var statuses = selectedStatuses();
    var projects = selectedValues('filter-projects');
    var sources = selectedValues('filter-sources');
    var rows = (snapshot.breakdownRows || []).filter(function (r) {
      if (projects.indexOf(r.project) === -1) return false;
      if (sources.indexOf(r.fundingSource) === -1) return false;
      if (r.status === 'secured' || r.status === 'proposed') {
        return statuses.indexOf(r.status) !== -1;
      }
      return true;
    });

    var totBudget = 0, totSecured = 0, totActual = 0, totWeighted = 0;
    rows.forEach(function (r) {
      totBudget += sumFys(r.budgetByQ, fys);
      totSecured += sumFys(r.securedByQ, fys);
      totActual += sumFys(r.actualByQ, fys);
      totWeighted += sumFys(r.weightedByQ, fys);
    });

    // The title: the years as the option reads, the statuses, and which projects and
    // sources, by name when a few are picked and by count otherwise.
    var sel = fySelectEl();
    function picked(id, noun) {
      var all = document.querySelectorAll('#' + id + ' input').length;
      var on = selectedValues(id);
      if (on.length === all) return 'all ' + noun;
      if (!on.length) return 'no ' + noun;
      return on.length <= 3 ? on.join(', ') : on.length + ' of ' + all + ' ' + noun;
    }
    document.getElementById('ov-title').textContent = [
      sel.options[sel.selectedIndex] ? sel.options[sel.selectedIndex].text : '',
      statusText(statuses),
      picked('filter-projects', 'projects'),
      picked('filter-sources', 'funding sources')
    ].join(' · ');

    // With the plan running from today, the cost card is actual spend so far plus what is
    // left, so it is named for that rather than for the budget.
    var costName = snapshot.planBasis === 'remaining' ? 'expected cost' : 'forecast budget';
    document.getElementById('totals').innerHTML =
      card(fy + ' ' + costName, fmtMoney(totBudget)) +
      card(fy + ' secured funding', fmtMoney(totSecured)) +
      card(fy + ' actual', fmtMoney(totActual)) +
      gapCard(fy + ' unsecured', totBudget - totSecured, 'danger') +
      gapCard(fy + ' after pipeline', totBudget - totWeighted, 'amber');
  }

  // "Secured and Proposed", "Secured (confirmed) only", "Nothing shown": the Show box
  // and the titles read the same.
  function statusText(statuses) {
    if (statuses.length === 2) return 'Secured and Proposed';
    return statuses.length ? statusLabel(statuses[0]) + ' only' : 'Nothing shown';
  }
  function updateStatusSummary() {
    var sum = document.getElementById('filter-status-sum');
    if (sum) sum.textContent = statusText(selectedStatuses());
  }

  // Cost minus income. A shortfall is a gap, in colour; more income than cost is a
  // surplus, shown as one rather than as a red $0.
  function gapCard(prefix, shortfall, cls) {
    if (shortfall > 0.5) return card(prefix + ' gap', fmtMoney(shortfall), cls);
    return card(prefix + ' surplus', fmtMoney(-shortfall));
  }

  function statusLabel(v) {
    if (v === 'secured') return 'Secured (confirmed)';
    if (v === 'proposed') return 'Proposed';
    return v;
  }

  // Everything here is arithmetic over the snapshot already in the page, so no control
  // needs a server round trip. Show changes the cards and the runway; group by the chart.
  Array.prototype.slice.call(document.querySelectorAll('.bd-status'))
    .forEach(function (c) { c.addEventListener('change', function () {
      updateStatusSummary(); renderOverview(); renderRunway(); }); });
  updateStatusSummary();
  Array.prototype.slice.call(document.querySelectorAll('.rw-group'))
    .forEach(function (c) { c.addEventListener('change', renderRunway); });

  Array.prototype.slice.call(document.querySelectorAll('.bd-dd-actions a')).forEach(function (a) {
    a.addEventListener('click', function (e) {
      e.preventDefault();
      var id = a.dataset.target, on = a.dataset.act === 'all';
      Array.prototype.slice.call(document.querySelectorAll('#' + id + ' input'))
        .forEach(function (i) { i.checked = on; });
      updateFilterSummary(id);
      rerenderFor(id);
    });
  });

  // Close filter dropdowns and help notes on outside click (and only keep one open at
  // a time).
  document.addEventListener('click', function (e) {
    Array.prototype.slice.call(document.querySelectorAll('.bd-dd[open]')).forEach(function (d) {
      if (!d.contains(e.target)) d.removeAttribute('open');
    });
    if (!e.target.closest || !e.target.closest('.help')) closeHelp();
  });
  // Close on Escape.
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      Array.prototype.slice.call(document.querySelectorAll('.bd-dd[open]'))
        .forEach(function (d) { d.removeAttribute('open'); });
      closeHelp();
    }
  });

  // The "?" at the right of a title: the explanation that used to sit on the page, shown
  // on tap. One open at a time, and it stays on screen: a note near the
  // right edge opens leftwards.
  Array.prototype.slice.call(document.querySelectorAll('.help-btn')).forEach(function (b) {
    b.addEventListener('click', function () {
      var pop = document.getElementById(b.getAttribute('aria-controls'));
      var wasOpen = !pop.classList.contains('hidden');
      closeHelp();
      if (wasOpen) return;
      pop.classList.remove('hidden');
      b.setAttribute('aria-expanded', 'true');
      pop.classList.toggle('flip', pop.getBoundingClientRect().right > window.innerWidth - 8);
    });
  });
  function closeHelp() {
    Array.prototype.slice.call(document.querySelectorAll('.help-pop'))
      .forEach(function (p) { p.classList.add('hidden'); });
    Array.prototype.slice.call(document.querySelectorAll('.help-btn'))
      .forEach(function (b) { b.setAttribute('aria-expanded', 'false'); });
  }

  function card(label, value, cls) {
    return '<div class="card"><div class="label">' + label + '</div>' +
      '<div class="value ' + (cls || '') + '">' + value + '</div></div>';
  }

  // ---- Runway ---------------------------------------------------------------
  // Funded runway: the month cumulative income stops covering cumulative spend. Not
  // cash runway; there is no bank balance anywhere in this system. It follows the show
  // and filter controls at the top of the tab, but not the financial-year selector: it
  // always runs from today. The walk is runwayWalk_, sent by the server as its own source
  // (Index.html), so every line here is the arithmetic the server's tests check.
  //
  // Group by Status draws three scenario lines as an ordinal ramp on the secured green:
  // dark is money in hand, each lighter step adds money that is less certain. Validated
  // against the card surface with the dataviz palette checker; the light end clears the
  // 2:1 floor. Any other grouping draws one expected-case line per group from a
  // categorical palette, the largest named and the rest folded into "Other".
  var RUNWAY_SERIES = [
    { key: 'secured',  label: 'Secured only',          color: 'var(--rw-1)' },
    { key: 'weighted', label: 'Expected (weighted)',   color: 'var(--rw-2)' },
    { key: 'proposed', label: 'All applications land', color: 'var(--rw-3)' }
  ];
  var GROUP_COLORS = ['var(--grp-1)', 'var(--grp-2)', 'var(--grp-3)', 'var(--grp-4)',
    'var(--grp-5)', 'var(--grp-6)', 'var(--grp-7)'];
  var GROUP_OTHER_COLOR = 'var(--grp-8)';
  // Colour thresholds for a line's horizon, in months. Presentation only.
  var RUNWAY_DANGER_MONTHS = 6, RUNWAY_AMBER_MONTHS = 12;
  // The chart starts this many months before the current financial year. The walk still
  // runs from the first budgeted month, so the lines open at their position then; the
  // earlier months are closed years and only flattened the part that matters.
  var RUNWAY_MONTHS_BEFORE_FY = 3;

  function netMoney(n) { return n < 0 ? '-' + fmtMoney(-n) : fmtMoney(n); }
  function compactMoney(n) {
    var a = Math.abs(n), s = n < 0 ? '-$' : '$';
    if (a >= 1e6) return s + (a / 1e6).toFixed(a >= 1e7 ? 0 : 1).replace(/\.0$/, '') + 'M';
    if (a >= 1e3) return s + Math.round(a / 1e3) + 'k';
    return s + Math.round(a);
  }
  function niceStep(raw) {
    var p = Math.pow(10, Math.floor(Math.log(raw) / Math.LN10));
    var f = raw / p;
    return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p;
  }
  function shortMonth(key) {
    var p = key.split('-');
    return MONTHS[parseInt(p[1], 10) - 1] + ' ' + p[0].slice(2);
  }

  function runwayGroupBy() {
    return document.getElementById('rw-group').value || 'status';
  }

  /** The runway parts the show and filter controls select. */
  function selectedRunwayParts(rw) {
    var statuses = selectedStatuses();
    var projects = selectedValues('filter-projects');
    var sources = selectedValues('filter-sources');
    return (rw.parts || []).filter(function (p) {
      return statuses.indexOf(p.status) !== -1 && projects.indexOf(p.project) !== -1 &&
        sources.indexOf(p.fundingSource) !== -1;
    });
  }

  function renderRunway() {
    var section = document.getElementById('runway-section');
    if (!section) return;
    var rw = snapshot && snapshot.runway;
    // Project-scoped users are not sent the runway at all; hide rather than show empty.
    if (!rw || !(rw.months || []).length) { section.classList.add('hidden'); return; }
    section.classList.remove('hidden');

    var chart = document.getElementById('runway-chart');
    var table = document.getElementById('runway-table');
    var statuses = selectedStatuses();
    // A snapshot written before the parts existed still draws the organisation's lines.
    var total = rw.parts ? runwayWalk_(selectedRunwayParts(rw), rw.nowKey) : rw;
    var mode = rw.parts ? runwayGroupBy() : 'status';
    var rows = total.months || [];

    function empty(note) {
      table.innerHTML = '';
      chart.innerHTML = '<div class="rw-note">' + note + '</div>';
    }
    if (!rows.length) return empty('Nothing matches show and filter above.');
    if (!rows.some(function (r) { return !r.actual; })) {
      return empty('No budget lines are dated after this month, so there is nothing to ' +
        'project. Extend a budget to see runway.');
    }

    // Only the scenarios the show boxes allow: with Proposed unticked there is no
    // application money, so the other two lines would only repeat secured.
    var scenarios = RUNWAY_SERIES.filter(function (s) {
      return statuses.indexOf(s.key === 'secured' ? 'secured' : 'proposed') !== -1;
    });
    var last = rows[rows.length - 1].month;

    var series = mode === 'status'
      ? scenarios.map(function (s) {
          return { label: s.label, color: s.color, cross: total.crossover[s.key],
            horizon: runwayHorizon(s.key, total, last),
            values: rows.map(function (r) { return r[s.key] - r.spend; }) };
        })
      : groupSeries(rw, mode, rows);

    // Crop after the walk, so the lines open at their true cumulative position.
    var from = runwayFromKey();
    var cut = 0;
    while (cut < rows.length - 1 && rows[cut].month < from) cut++;
    if (cut) {
      rows = rows.slice(cut);
      series.forEach(function (s) { s.values = s.values.slice(cut); });
    }

    renderRunwayChart(rows, series, chart, mode === 'status', total.openingNet || 0);
    table.innerHTML = runwayTable(rows, series, mode === 'status');
    table.querySelector('details').addEventListener('toggle', function (ev) {
      runwayTableOpen = ev.target.open;
    });
  }

  // One expected-case line per group. With Proposed unticked there are no application
  // parts, so expected is secured. Every group walks the total's months, so each line has
  // a value in every month and the lines add up to the total. The largest groups, by how
  // far they ever sit from zero, are named; the rest are walked together as "Other".
  function groupSeries(rw, mode, rows) {
    var axis = rows.map(function (r) { return r.month; });
    var byKey = {};
    selectedRunwayParts(rw).forEach(function (p) {
      var k = p[mode] || '(unassigned)';
      (byKey[k] = byKey[k] || []).push(p);
    });
    function line(label, parts, color) {
      var w = runwayWalk_(parts, rw.nowKey, axis);
      var values = w.months.map(function (r) { return r.weighted - r.spend; });
      return { label: label, color: color, cross: w.crossover.weighted, values: values,
        parts: parts,
        size: values.reduce(function (m, v) { return Math.max(m, Math.abs(v)); }, 0) };
    }
    var groups = Object.keys(byKey).map(function (k) { return line(k, byKey[k]); })
      .sort(function (a, b) { return b.size - a.size; });
    var named = groups.length > GROUP_COLORS.length
      ? groups.slice(0, GROUP_COLORS.length - 1) : groups;
    named.forEach(function (g, i) { g.color = GROUP_COLORS[i]; });
    if (named.length < groups.length) {
      var rest = [];
      groups.slice(named.length).forEach(function (g) { rest = rest.concat(g.parts); });
      named.push(line('Other (' + (groups.length - named.length) + ')', rest, GROUP_OTHER_COLOR));
    }
    return named;
  }

  // The line's second label line: the month it goes short and how far off that is, or
  // that it stays above zero to the last budgeted month. Not the same as safe: it may
  // only mean the budgets stop, which is why that month is named.
  function runwayHorizon(key, rw, lastMonth) {
    var n = rw.monthsOfRunway ? rw.monthsOfRunway[key] : null;
    var at = rw.crossover ? rw.crossover[key] : null;
    if (n === null || n === undefined) return { text: 'beyond ' + fmtMonthKey(lastMonth), cls: '' };
    var cls = n < RUNWAY_DANGER_MONTHS ? 'danger' : (n < RUNWAY_AMBER_MONTHS ? 'amber' : '');
    if (n === 0) return { text: 'short now', cls: cls };
    return { text: n + (n === 1 ? ' month' : ' months') + ', short from ' + fmtMonthKey(at),
      cls: cls };
  }

  // The first month the chart draws: RUNWAY_MONTHS_BEFORE_FY before the current
  // financial year, as a 'YYYY-MM' key.
  function runwayFromKey() {
    var c = snapshot && snapshot.coverage;
    if (!c || !c.fyStart) return '';
    var p = zoned(c.fyStart, { month: 'numeric', year: 'numeric' });
    var y = parseInt(p.year, 10), m = parseInt(p.month, 10) - RUNWAY_MONTHS_BEFORE_FY;
    if (m < 1) { m += 12; y--; }
    return y + '-' + ('0' + m).slice(-2);
  }

  // `series` is most important first: { label, color, values (net per month), cross,
  // horizon }. `net` is the net position today, income received minus spend to date.
  function renderRunwayChart(rows, series, host, withSpend, net) {
    // Sized to the container once at render, so text is 1:1 rather than scaled with
    // the viewBox. If the Overview is hidden when a refresh lands, the fallback width
    // still scales cleanly because the SVG is also width:100%.
    var twoLine = series.some(function (s) { return s.horizon; });
    var W = Math.max(480, host.clientWidth || 720), H = 240;
    var padL = 64, padR = twoLine ? 180 : 150, padT = 22, padB = 30;
    var pw = W - padL - padR, ph = H - padT - padB;
    var n = rows.length;
    var xStep = pw / Math.max(1, n - 1);
    var xOf = function (i) { return padL + (n === 1 ? pw / 2 : i * xStep); };

    var lo = 0, hi = 0;
    series.forEach(function (s) {
      s.values.forEach(function (v) { if (v < lo) lo = v; if (v > hi) hi = v; });
    });
    if (hi === lo) hi = lo + 1;
    var step = niceStep((hi - lo) / 4);
    var yMin = Math.floor(lo / step) * step, yMax = Math.ceil(hi / step) * step;
    var yOf = function (v) { return padT + (yMax - v) / (yMax - yMin) * ph; };

    var svg = ['<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H +
      '" role="img" aria-label="Net funded position by month, ' + series.length +
      ' line' + (series.length === 1 ? '' : 's') + '">'];

    // Wash and today rule first, so the lines sit on top of them. The rule carries the
    // net position today, which is where the budget months start from.
    var netLabel = '<tspan class="rw-net' + (net < 0 ? ' danger' : '') + '"> · net position ' +
      esc(netMoney(net)) + '</tspan>';
    var firstFuture = -1;
    for (var i = 0; i < n; i++) { if (!rows[i].actual) { firstFuture = i; break; } }
    if (firstFuture > 0) {
      var tx = (xOf(firstFuture - 1) + xOf(firstFuture)) / 2;
      svg.push('<rect class="rw-future" x="' + tx + '" y="' + padT + '" width="' +
        (padL + pw - tx) + '" height="' + ph + '"/>');
      svg.push('<line class="rw-today" x1="' + tx + '" x2="' + tx + '" y1="' + padT +
        '" y2="' + (padT + ph) + '"/>');
      svg.push('<text class="rw-axis" x="' + (tx + 4) + '" y="' + (padT - 8) + '">today' +
        netLabel + '</text>');
    } else if (firstFuture === 0) {
      svg.push('<rect class="rw-future" x="' + padL + '" y="' + padT + '" width="' + pw +
        '" height="' + ph + '"/>');
      svg.push('<text class="rw-axis" x="' + padL + '" y="' + (padT - 8) +
        '">every month shown is budget' + netLabel + '</text>');
    }

    // Grid, one hairline per tick, with the zero line a shade stronger.
    for (var v = yMin; v <= yMax + 1e-9; v += step) {
      var y = yOf(v);
      svg.push('<line class="' + (Math.abs(v) < 1e-9 ? 'rw-zero' : 'rw-grid') + '" x1="' +
        padL + '" x2="' + (padL + pw) + '" y1="' + y + '" y2="' + y + '"/>');
      svg.push('<text class="rw-axis" x="' + (padL - 8) + '" y="' + (y + 4) +
        '" text-anchor="end">' + compactMoney(v) + '</text>');
    }
    // Month labels thinned to stay at least 56px apart.
    var every = Math.max(1, Math.ceil(56 / xStep));
    for (var j = 0; j < n; j += every) {
      svg.push('<text class="rw-axis" x="' + xOf(j) + '" y="' + (H - 8) +
        '" text-anchor="middle">' + shortMonth(rows[j].month) + '</text>');
    }

    // Lines, least important first so the first series draws on top. A hollow dot on the
    // zero line marks each crossover month; the line's label names it, so no text here.
    var ends = [];
    series.slice().reverse().forEach(function (s) {
      var d = s.values.map(function (val, k) {
        return (k ? 'L' : 'M') + xOf(k).toFixed(1) + ' ' + yOf(val).toFixed(1);
      }).join(' ');
      svg.push('<path class="rw-line" style="stroke:' + s.color + '" d="' + d + '"/>');
      if (s.cross) {
        for (var q = 0; q < n; q++) {
          if (rows[q].month === s.cross) {
            svg.push('<circle class="rw-cross" cx="' + xOf(q) + '" cy="' + yOf(0) +
              '" r="4"/>');
            break;
          }
        }
      }
      ends.push({ s: s, rank: series.indexOf(s), x: xOf(n - 1), y: yOf(s.values[n - 1]) });
    });
    // End dots wear a 2px surface ring so they read where lines overlap.
    ends.forEach(function (e) {
      svg.push('<circle class="rw-dot" cx="' + e.x + '" cy="' + e.y + '" r="5" fill="' +
        e.s.color + '"/>');
    });
    // Direct labels at the line ends: the name, and under it the horizon when the series
    // has one. These are the only legend, so where ends coincide the labels are pushed
    // apart down the page rather than hidden, then back up from the bottom edge. Long
    // group names are cut to fit the margin; the tooltip and the table have them whole.
    var gap = twoLine ? 28 : 14;
    ends.sort(function (a, b) { return a.y - b.y; });
    ends.forEach(function (e, k) {
      e.ly = k && e.y - ends[k - 1].ly < gap ? ends[k - 1].ly + gap : e.y;
    });
    var over = ends.length ? ends[ends.length - 1].ly + gap / 2 - H : 0;
    if (over > 0) ends.forEach(function (e) { e.ly -= over; });
    ends.forEach(function (e) {
      var name = e.s.label.length > 22 ? e.s.label.slice(0, 21) + '…' : e.s.label;
      if (!e.s.horizon) {
        svg.push('<text class="rw-end" x="' + (e.x + 10) + '" y="' + (e.ly + 4) + '">' +
          esc(name) + '</text>');
        return;
      }
      svg.push('<text class="rw-end" x="' + (e.x + 10) + '" y="' + (e.ly - 2) + '">' +
        esc(name) + '</text>');
      svg.push('<text class="rw-end-sub ' + e.s.horizon.cls + '" x="' + (e.x + 10) + '" y="' +
        (e.ly + 11) + '">' + esc(e.s.horizon.text) + '</text>');
    });

    // Crosshair and the hit area, last so the hit area is on top.
    svg.push('<line id="rw-xh" class="rw-today" style="display:none" y1="' + padT +
      '" y2="' + (padT + ph) + '"/>');
    svg.push('<rect id="rw-hit" x="' + padL + '" y="' + padT + '" width="' + pw +
      '" height="' + ph + '" fill="transparent"/>');
    svg.push('</svg>');
    host.innerHTML = svg.join('') + '<div class="rw-tip hidden" id="rw-tip"></div>';
    host.setAttribute('tabindex', '0');
    host.setAttribute('aria-label', 'Runway chart. Use the arrow keys to read each month.');

    // Hover layer: the crosshair snaps to the nearest month and one tooltip lists every
    // line there, so nobody has to land on a 2px line. Same readout on keyboard focus.
    var tip = document.getElementById('rw-tip');
    var xh = document.getElementById('rw-xh');
    var svgEl = host.querySelector('svg');
    var cur = -1;
    function row(value, color, label) {
      var r = document.createElement('div'); r.className = 'r';
      var b = document.createElement('b'); b.textContent = value; r.appendChild(b);
      if (color) { var k = document.createElement('i'); k.className = 'k'; k.style.background = color; r.appendChild(k); }
      var l = document.createElement('span'); l.className = 'l'; l.textContent = label; r.appendChild(l);
      return r;
    }
    function show(i) {
      if (i < 0 || i >= n) return;
      cur = i;
      var x = xOf(i);
      xh.setAttribute('x1', x); xh.setAttribute('x2', x); xh.style.display = '';
      while (tip.firstChild) tip.removeChild(tip.firstChild);
      var m = document.createElement('div'); m.className = 'm';
      m.textContent = fmtMonthKey(rows[i].month) + (rows[i].actual ? ' · actual' : ' · budget');
      tip.appendChild(m);
      series.forEach(function (s) { tip.appendChild(row(netMoney(s.values[i]), s.color, s.label)); });
      if (withSpend) tip.appendChild(row(fmtMoney(rows[i].spend), null, 'cumulative spend'));
      tip.classList.remove('hidden');
      var scale = svgEl.getBoundingClientRect().width / W;
      var px = x * scale, left = px + 12, tw = tip.offsetWidth || 200;
      if (left + tw > host.clientWidth - 8) left = px - tw - 12;
      tip.style.left = Math.max(4, left) + 'px';
      tip.style.top = (padT * scale + 8) + 'px';
    }
    function hide() { xh.style.display = 'none'; tip.classList.add('hidden'); cur = -1; }
    host.querySelector('#rw-hit').addEventListener('pointermove', function (ev) {
      var rect = svgEl.getBoundingClientRect();
      var vx = (ev.clientX - rect.left) * (W / rect.width);
      show(Math.max(0, Math.min(n - 1, Math.round((vx - padL) / xStep))));
    });
    host.onpointerleave = hide;
    host.onfocus = function () { if (cur < 0) show(firstFuture >= 0 ? firstFuture : 0); };
    host.onblur = hide;
    host.onkeydown = function (ev) {
      if (ev.key === 'ArrowRight') { show(cur < 0 ? 0 : Math.min(n - 1, cur + 1)); ev.preventDefault(); }
      else if (ev.key === 'ArrowLeft') { show(cur < 0 ? n - 1 : Math.max(0, cur - 1)); ev.preventDefault(); }
      else if (ev.key === 'Escape') { hide(); }
    };
  }

  // The accessibility twin of the chart: every value it draws, reachable without hover.
  // Kept open across redraws, so changing a control does not fold it away.
  var runwayTableOpen = false;
  function runwayTable(rows, series, withSpend) {
    var h = '<details class="rw-table"' + (runwayTableOpen ? ' open' : '') +
      '><summary>Show as a table</summary>' +
      '<div class="table-wrap"><table><thead><tr><th>Month</th><th>Basis</th>' +
      (withSpend ? '<th class="num">Cumulative spend</th>' : '') +
      series.map(function (s) {
        return '<th class="num">Net, ' + esc(withSpend ? s.label.toLowerCase() : s.label) + '</th>';
      }).join('') + '</tr></thead><tbody>';
    rows.forEach(function (r, i) {
      h += '<tr><td>' + esc(fmtMonthKey(r.month)) + '</td><td>' +
        (r.actual ? 'actual' : 'budget') + '</td>' +
        (withSpend ? '<td class="num">' + fmtMoney(r.spend) + '</td>' : '') +
        series.map(function (s) {
          return '<td class="num">' + netMoney(s.values[i]) + '</td>';
        }).join('') + '</tr>';
    });
    return h + '</tbody></table></div></details>';
  }

  // ---- Refresh progress ---------------------------------------------------
  // apiRefresh blocks for about a minute. Apps Script cannot stream, so the server
  // writes its phase to CacheService and we poll apiRefreshProgress for it.
  //
  // The poll only answers if Apps Script runs it concurrently with the refresh. If it
  // does not, sawProgress stays false and the label says so rather than lying: the
  // elapsed counter still runs, so the wait is bounded either way.
  var progressTimer = null, elapsedTimer = null, startedAt = 0, sawProgress = false;

  function showProgress(on) {
    var box = document.getElementById('refresh-progress');
    if (box) box.classList.toggle('hidden', !on);
    if (!on) setBar(0, '');
  }

  function setBar(pct, label) {
    var fill = document.getElementById('refresh-bar-fill');
    var text = document.getElementById('refresh-bar-label');
    if (fill) fill.style.width = Math.max(0, Math.min(100, pct)) + '%';
    if (text) text.textContent = label;
  }

  function elapsedText() {
    return Math.round((new Date().getTime() - startedAt) / 1000) + 's';
  }

  function startProgress() {
    startedAt = new Date().getTime();
    sawProgress = false;
    showProgress(true);
    setBar(0, 'starting… 0s');

    elapsedTimer = setInterval(function () {
      if (!sawProgress) setBar(0, 'working… ' + elapsedText() + ' (no progress detail)');
    }, 1000);

    progressTimer = setInterval(function () {
      google.script.run.withSuccessHandler(function (p) {
        if (!p) return;                       // finished, or not started yet
        sawProgress = true;
        // Prefer the server's overall pct: it bands the phases by measured duration, so
        // the bar only moves forward. done/total is the fallback for older payloads.
        var pct = (p.pct === null || p.pct === undefined)
          ? (p.total > 0 ? (p.done / p.total) * 100 : 0)
          : p.pct;
        var counter = p.total > 0 ? ' (' + p.done + ' of ' + p.total + ')' : '';
        setBar(pct, p.phase + counter + ' · ' + elapsedText());
      }).withFailureHandler(function () { /* a failed poll must not break the refresh */ })
        .apiRefreshProgress();
    }, 1500);
  }

  function stopProgress() {
    if (progressTimer) { clearInterval(progressTimer); progressTimer = null; }
    if (elapsedTimer) { clearInterval(elapsedTimer); elapsedTimer = null; }
    showProgress(false);
  }

  function load(force) {
    var btn = document.getElementById('refresh');
    btn.disabled = true; btn.textContent = force ? 'Refreshing…' : 'Refresh now';
    if (force) startProgress();
    var call = google.script.run
      .withSuccessHandler(function (s) {
        stopProgress();
        render(s); btn.disabled = false; btn.textContent = 'Refresh now';
      })
      .withFailureHandler(function (e) {
        stopProgress();
        document.getElementById('sync-label').textContent = 'error: ' + errText(e);
        btn.disabled = false; btn.textContent = 'Refresh now';
      });
    force ? call.apiRefresh() : call.apiGetSnapshot();
  }

  document.getElementById('refresh').addEventListener('click', function () { load(true); });
  load(false);

  // ---- Project tracking ----------------------------------------------------
  // One project at a time, fetched once (apiGetProjectTracking) and laid out here in
  // either view: the actual-and-forecast grid or the timeline. Every control on the
  // ribbon is arithmetic over that payload, so only the project and Refresh now go back
  // to the server.

  var trLoaded = false, trData = null, trView = 'grid', trMeasure = 'cost';

  function switchView(view) {
    document.querySelectorAll('.tab').forEach(function (t) {
      t.classList.toggle('active', t.dataset.view === view);
    });
    ['overview', 'tracking', 'health'].forEach(function (v) {
      document.getElementById('view-' + v).classList.toggle('hidden', view !== v);
    });
    // Health needs no lazy load: the findings arrive with the snapshot and renderHealth
    // has already written them.
    if (view === 'tracking' && !trLoaded) { trLoaded = true; loadTrackingProjects(); }
  }
  document.querySelectorAll('.tab').forEach(function (t) {
    t.addEventListener('click', function () { switchView(t.dataset.view); });
  });

  var MLAB = {
    cost:   { base: 'Budget',     actual: 'Actual',      expected: 'Expected' },
    income: { base: 'Budgeted',   actual: 'Received',    expected: 'Expected' },
    net:    { base: 'Budget net', actual: 'Net to date', expected: 'Expected net' }
  };

  // The Drive folder each project's budgets live in, for the link beside the dropdown.
  var PROJECT_LINKS = {
    'Spyfish Aotearoa': 'https://drive.google.com/drive/folders/1ibbPTQS2yMFf7H1FQKIoqUpKm9r3B6cL?usp=drive_link',
    'General': 'https://drive.google.com/drive/folders/1z8bG15aUiCQBqJg8mV6Ls4c9tDeYl9ZP?usp=drive_link',
    'Wildlife Watcher': 'https://drive.google.com/drive/folders/189qkgjD-aNoxAyNCLEpwJJG0ZHN_pJMZ?usp=drive_link',
    'Wild About Ai': 'https://drive.google.com/drive/folders/1Qy-ScHTTDa4VyrURVkDJzK5LzhewKXsP?usp=drive_link'
  };

  // google.script.run hands the failure handler whatever went wrong, which is not always
  // an Error with a message; "error: undefined" said nothing about it.
  function errText(e) { return e && e.message ? e.message : String(e); }

  function trStatus(text) { document.getElementById('tr-status').textContent = text; }

  function loadTrackingProjects() {
    var sel = document.getElementById('tr-project');
    trStatus('loading projects…');
    google.script.run.withSuccessHandler(function (projects) {
      if (!projects.length) { trStatus('No projects found.'); return; }
      sel.innerHTML = projects.map(function (p) {
        return '<option value="' + esc(p) + '">' + esc(p) + '</option>';
      }).join('');
      sel.addEventListener('change', function () { loadProjectTracking(sel.value); });
      loadProjectTracking(projects[0]);
    }).withFailureHandler(function (e) {
      // A failed first load is retried on the next click of the tab, not left for good.
      trLoaded = false;
      trStatus('error: ' + errText(e) + '. Click the tab again to retry.');
    }).apiListProjects();
  }

  function loadProjectTracking(project) {
    var link = document.getElementById('tr-folder');
    link.classList.toggle('hidden', !PROJECT_LINKS[project]);
    if (PROJECT_LINKS[project]) link.href = PROJECT_LINKS[project];
    trStatus('loading…');
    google.script.run.withSuccessHandler(function (t) {
      trData = t;
      buildTrackingFilters(t);
      buildQuarterRange(t);
      renderTracking();
    }).withFailureHandler(function (e) {
      trStatus('error: ' + errText(e));
    }).apiGetProjectTracking(project);
  }

  function buildTrackingFilters(t) {
    fillFilter('tr-sources', t.sources.map(function (s) { return s.source; }));
    var names = {};
    t.sources.forEach(function (s) {
      s.milestones.forEach(function (m) { names[m.milestone] = true; });
    });
    fillFilter('tr-milestones', Object.keys(names).sort());
  }

  // The quarters shown: this financial year's first quarter to the last quarter with
  // anything in it, unless a choice made earlier still fits the new project.
  function buildQuarterRange(t) {
    var from = document.getElementById('tr-from'), to = document.getElementById('tr-to');
    var labels = t.quarters.map(function (q) { return q.label; });
    var fyFirst = fyOf(t.currentQuarter) + ' Q1';
    [from, to].forEach(function (sel, i) {
      var keep = sel.value;
      sel.innerHTML = labels.map(function (l) {
        return '<option value="' + esc(l) + '">' + esc(l) + '</option>';
      }).join('');
      if (labels.indexOf(keep) !== -1) sel.value = keep;
      else if (i) sel.value = labels[labels.length - 1];
      else sel.value = labels.indexOf(fyFirst) !== -1 ? fyFirst : labels[0];
    });
  }

  // A from set after its to pulls the other along, so the range is never empty.
  ['tr-from', 'tr-to'].forEach(function (id) {
    document.getElementById(id).addEventListener('change', function () {
      var from = document.getElementById('tr-from'), to = document.getElementById('tr-to');
      if (qiOf(from.value) > qiOf(to.value)) (id === 'tr-from' ? to : from).value = this.value;
      renderTracking();
    });
  });
  // The Show and Columns boxes say what they hold, as the Overview's Show box does.
  function updateTrShowSummary() {
    var statuses = Array.prototype.slice.call(document.querySelectorAll('.tr-status:checked'))
      .map(function (c) { return c.value; });
    document.getElementById('tr-show-sum').textContent = statusText(statuses) +
      (document.getElementById('tr-finished').checked ? '' : ' · finished hidden');
    var cols = Array.prototype.slice.call(document.querySelectorAll('.tr-col:checked'))
      .map(function (c) { return c.parentElement.textContent.trim(); });
    document.getElementById('tr-cols-sum').textContent = cols.length ? cols.join(', ') : 'Columns';
  }
  updateTrShowSummary();
  Array.prototype.slice.call(document.querySelectorAll('.tr-status, .tr-col, #tr-finished'))
    .forEach(function (c) { c.addEventListener('change', function () {
      updateTrShowSummary(); renderTracking(); }); });
  document.getElementById('tr-measure').addEventListener('change', function () {
    trMeasure = this.value;
    renderTracking();
  });
  // The measure belongs to the grid and the columns to the timeline, so each view shows
  // only the box that acts on it.
  document.getElementById('tr-view').addEventListener('change', function () {
    trView = this.value;
    var grid = trView === 'grid';
    document.getElementById('tr-measure').classList.toggle('hidden', !grid);
    document.getElementById('tr-columns').classList.toggle('hidden', grid);
    document.getElementById('tr-legend').classList.toggle('hidden', grid);
    renderTracking();
  });

  // "26/27 Q3" as a number that orders: the server's qiOfLabel_.
  function qiOf(label) {
    var m = /^(\d\d)\/\d\d Q([1-4])$/.exec(label || '');
    return m ? (2000 + parseInt(m[1], 10)) * 4 + (parseInt(m[2], 10) - 1) : 0;
  }

  // One milestone's figures for a quarter on the chosen measure. The server's forecast is
  // null where the Forecast tab has no entry, and effective already follows the rule
  // (actual to the current quarter, then the forecast or the budget). Net is income minus
  // cost field by field; its forecast counts as entered when either side has one.
  function cellOf(m, q, measure) {
    var c = m.byQ[q];
    var none = { budget: 0, actual: 0, forecast: null, effective: 0 };
    var cost = c ? c.cost : none, inc = c ? c.income : none;
    function one(x) {
      return { budget: x.budget, actual: x.actual, hasForecast: x.forecast !== null,
        forecast: x.forecast === null ? x.budget : x.forecast, effective: x.effective };
    }
    if (measure === 'cost') return one(cost);
    if (measure === 'income') return one(inc);
    var a = one(inc), b = one(cost);
    return { budget: a.budget - b.budget, actual: a.actual - b.actual,
      hasForecast: a.hasForecast || b.hasForecast, forecast: a.forecast - b.forecast,
      effective: a.effective - b.effective };
  }

  function renderTracking() {
    var t = trData;
    if (!t) return;
    trStatus('');
    var statuses = Array.prototype.slice.call(document.querySelectorAll('.tr-status:checked'))
      .map(function (c) { return c.value; });
    var sources = selectedValues('tr-sources');
    var names = selectedValues('tr-milestones');
    var hideFinished = !document.getElementById('tr-finished').checked;
    var fromQ = document.getElementById('tr-from').value, toQ = document.getElementById('tr-to').value;
    var fromQi = qiOf(fromQ), toQi = qiOf(toQ);
    var inRange = t.quarters.filter(function (q) {
      return qiOf(q.label) >= fromQi && qiOf(q.label) <= toQi;
    });
    var before = t.quarters.filter(function (q) { return qiOf(q.label) < fromQi; })
      .map(function (q) { return q.label; });

    // Finished: nothing budgeted or spent in the quarters shown, and over before them.
    // A milestone that has not started yet is not finished, however empty its range.
    function finished(m) {
      var inside = inRange.some(function (q) {
        var c = m.byQ[q.label];
        return c && (c.cost.budget || c.cost.actual || c.income.budget || c.income.actual);
      });
      if (inside) return false;
      var last = m.to ? qiOf(m.to)
        : Math.max.apply(null, Object.keys(m.byQ).map(qiOf).concat([-1]));
      return last < fromQi;
    }

    var groups = [], total = 0, shown = 0;
    t.sources.forEach(function (s) {
      total += s.milestones.length;
      if (sources.indexOf(s.source) === -1) return;
      if (s.status && statuses.indexOf(s.status) === -1) return;
      var ms = s.milestones.filter(function (m) {
        if (names.indexOf(m.milestone) === -1) return false;
        if (m.status && statuses.indexOf(m.status) === -1) return false;
        return !(hideFinished && finished(m));
      });
      if (!ms.length) return;
      shown += ms.length;
      groups.push({ source: s, milestones: ms });
    });

    // The title names everything the controls chose, so the grid reads on its own in a
    // screenshot: project, status, measure, quarters and how many milestones.
    document.getElementById('tr-title').textContent = [
      t.project,
      statusText(statuses),
      trView === 'grid' ? trMeasure.charAt(0).toUpperCase() + trMeasure.slice(1) : null,
      fromQ + ' to ' + toQ,
      (shown < total ? shown + ' of ' + total : shown) + (total === 1 ? ' milestone' : ' milestones')
    ].filter(Boolean).join(' · ');

    var grid = document.getElementById('tr-grid');
    var totals = document.getElementById('tr-totals');
    if (!groups.length) {
      grid.innerHTML = '<div style="padding:24px;color:var(--muted)">Nothing matches the ' +
        'current filters.</div>';
      totals.innerHTML = '';
      return;
    }
    if (trView === 'grid') renderTrGrid(t, groups, before, inRange, fromQ);
    else renderTrTimeline(groups, inRange);
  }

  // A funding source's heading cell: the fold mark, the sheet link, the name, the status.
  // Clicking the row folds its milestones away and keeps its subtotals; the fold survives
  // every re-render and a change of view.
  var trFolded = {};
  function srcLabel(s) {
    return '<span class="src-toggle">' + (trFolded[s.source] ? '▸' : '▾') + '</span>' +
      (s.sheetUrl ? '<a class="src-link" href="' + esc(s.sheetUrl) + '" target="_blank" ' +
      'title="Open the ' + esc(s.source) + ' spreadsheet">📄</a> ' : '') + esc(s.source) +
      (s.status ? '<span class="src-status">' + esc(statusLabel(s.status)) + '</span>' : '');
  }
  function srcRow(s, cells) {
    return '<tr class="src-row" data-src="' + esc(s.source) + '"><td class="mile gantt-label">' +
      srcLabel(s) + '</td>' + cells + '</tr>';
  }
  document.getElementById('tr-grid').addEventListener('click', function (e) {
    if (e.target.closest('a')) return;
    var row = e.target.closest('tr.src-row');
    if (!row) return;
    var src = row.getAttribute('data-src');
    trFolded[src] = !trFolded[src];
    renderTracking();
  });

  // ---- The actual-and-forecast grid. Columns: "Before" lumping every quarter earlier
  // than the first shown, then the quarters shown. The totals on the right are the whole
  // source, every quarter, so the row still reconciles whatever the range.
  function renderTrGrid(t, groups, before, inRange, fromQ) {
    var lab = MLAB[trMeasure];
    var currentQi = qiOf(t.currentQuarter);
    var allQ = t.quarters.map(function (q) { return q.label; });
    var cols = [];
    if (before.length) cols.push({ type: 'aggregate', label: 'Before ' + fromQ });
    inRange.forEach(function (q) {
      cols.push({ type: 'quarter', label: q.label, past: q.past, current: q.current });
    });

    function rowOf(m) {
      var cells = cols.map(function (col) {
        if (col.type === 'aggregate') {
          var b = 0, a = 0;
          before.forEach(function (q) { var c = cellOf(m, q, trMeasure); b += c.budget; a += c.actual; });
          return { budget: b, actual: a, forecast: a, hasForecast: false, effective: a };
        }
        return cellOf(m, col.label, trMeasure);
      });
      var budget = 0, actual = 0, entered = 0, expected = 0;
      allQ.forEach(function (q) {
        var c = cellOf(m, q, trMeasure);
        budget += c.budget; actual += c.actual; expected += c.effective;
        // Forecast entered: only quarters with an entry on the Forecast tab, from the
        // current one on. Expected still carries the budget where there is none; the two
        // answer different questions, what we have said and what we expect.
        if (c.hasForecast && qiOf(q) >= currentQi) entered += c.forecast;
      });
      return { cells: cells, budget: budget, actual: actual, entered: entered,
        expected: expected, variance: expected - budget };
    }
    function sumRows(rows) {
      var out = { cells: cols.map(function () {
        return { budget: 0, actual: 0, forecast: 0, hasForecast: false, effective: 0 }; }),
        budget: 0, actual: 0, entered: 0, expected: 0, variance: 0 };
      rows.forEach(function (r) {
        r.cells.forEach(function (c, i) {
          var o = out.cells[i];
          o.budget += c.budget; o.actual += c.actual; o.forecast += c.forecast;
          o.effective += c.effective; o.hasForecast = o.hasForecast || c.hasForecast;
        });
        ['budget', 'actual', 'entered', 'expected', 'variance'].forEach(function (k) { out[k] += r[k]; });
      });
      return out;
    }

    function cellCls(col) {
      if (col.type === 'aggregate') return 'col-actual agg';
      return ((col.past || col.current) ? 'col-actual' : 'col-forecast') +
        (col.current ? ' col-current' : '');
    }
    var main = function (s) { return '<span class="cell-actual">' + s + '</span>'; };
    var sub = function (s) { return '<span class="cell-base">' + s + '</span>'; };
    function cellTd(c, col, summary) {
      var inner;
      if (col.type === 'aggregate' || col.past) {
        inner = main(money0(c.actual)) + sub('budget ' + money0(c.budget));
      } else if (col.current) {
        inner = main('actual ' + money0(c.actual)) +
          (c.hasForecast ? main('forecast ' + money0(c.forecast)) : '') +
          sub('budget ' + money0(c.budget));
      } else if (summary) {
        // A heading row: the sum of each milestone's forecast or budget, over the budget.
        inner = main(money0(c.effective)) + sub('budget ' + money0(c.budget));
      } else if (!c.hasForecast) {
        inner = '<span class="no-fc">' + money0(c.budget) + '</span>' + sub('budget, no override');
      } else {
        inner = main(money0(c.forecast)) + sub('budget ' + money0(c.budget));
      }
      return '<td class="' + cellCls(col) + '"><div class="cell-q">' + inner + '</div></td>';
    }
    function totalTds(r) {
      return '<td class="tot">' + money0(r.budget) + '</td>' +
        '<td class="tot">' + money0(r.actual) + '</td>' +
        '<td class="tot">' + money0(Math.round(r.entered)) + '</td>' +
        '<td class="tot ' + varClassM(r.variance, trMeasure) + '">' + signed(r.variance) + '</td>';
    }

    var actualCount = cols.filter(function (c) { return c.type === 'aggregate' || c.past || c.current; }).length;
    var forecastCount = cols.length - actualCount;
    var head = '<thead><tr class="zone-row"><th class="mile"></th>' +
      (actualCount ? '<th colspan="' + actualCount + '" class="zone-actual">ACTUAL <span class="zone-src">from Xero</span></th>' : '') +
      (forecastCount ? '<th colspan="' + forecastCount + '" class="zone-forecast">FORECAST <span class="zone-src">from gsheet</span></th>' : '') +
      '<th colspan="5" class="zone-totals">TOTALS</th></tr>' +
      '<tr><th class="mile">Funding / Milestone</th>' +
      cols.map(function (col) { return '<th class="' + cellCls(col) + '">' + esc(col.label) + '</th>'; }).join('') +
      '<th class="tot">' + lab.base + '</th><th class="tot">' + lab.actual + '</th>' +
      '<th class="tot" title="Only quarters with an entry on the Forecast tab. ' +
      'Quarters with no entry fall back to the budget for Expected and Variance, ' +
      'but are not counted here.">Forecast entered</th>' +
      '<th class="tot">Variance</th><th class="cmt-h">Comment</th></tr></thead>';

    var all = [];
    var body = '<tbody>' + groups.map(function (g) {
      var rows = g.milestones.map(rowOf);
      var sum = sumRows(rows);
      all.push(sum);
      return srcRow(g.source,
        sum.cells.map(function (c, i) { return cellTd(c, cols[i], true); }).join('') +
        totalTds(sum) + '<td class="cmt-c"></td>') +
        (trFolded[g.source.source] ? '' : rows.map(function (r, k) {
          var m = g.milestones[k];
          return '<tr><td class="mile">' + esc(m.milestone) + '</td>' +
            r.cells.map(function (c, i) { return cellTd(c, cols[i], false); }).join('') +
            totalTds(r) + '<td class="cmt-c">' +
            (m.comment ? '<span class="cmt-text">' + esc(m.comment) + '</span>' : '') + '</td></tr>';
        }).join(''));
    }).join('') + '</tbody>';

    var grand = sumRows(all);
    var foot = '<tfoot><tr><td class="mile">Total</td>' +
      grand.cells.map(function (c, i) {
        return '<td class="' + cellCls(cols[i]) + '">' + money0(c.effective) + '</td>';
      }).join('') + totalTds(grand) + '<td></td></tr></tfoot>';

    document.getElementById('tr-grid').innerHTML =
      '<table id="track-grid-table">' + head + body + foot + '</table>';
    document.getElementById('tr-totals').innerHTML =
      tot(lab.base, money0(grand.budget)) +
      tot(lab.actual + ' to date', money0(grand.actual)) +
      tot(lab.expected + ' (actual + forecast)', money0(grand.expected)) +
      tot('Variance', '<span class="' + varClassM(grand.variance, trMeasure) + '">' +
        signed(grand.variance) + '</span>');
  }

  // ---- The timeline: a bar across the quarters each milestone runs, coloured by the
  // status of the money paying for it. Hovering a quarter gives its budget, and the
  // actual once the quarter has begun. The optional columns total the quarters shown.
  function renderTrTimeline(groups, inRange) {
    var cols = Array.prototype.slice.call(document.querySelectorAll('.tr-col:checked'))
      .map(function (c) { return c.value; });
    var COL_LABEL = { cost: 'Cost', income: 'Income', pl: 'Profit &amp; loss' };
    function figTds(cost, income) {
      return cols.map(function (c) {
        var v = c === 'cost' ? cost : (c === 'income' ? income : income - cost);
        var cls = 'num gantt-fig' + (c === 'pl' ? (v < 0 ? ' neg' : ' pos') : '');
        return '<td class="' + cls + '">' + money0(v) + '</td>';
      }).join('');
    }
    var head = '<thead><tr><th>Funding / Milestone</th>' +
      cols.map(function (c) { return '<th class="num gantt-fig">' + COL_LABEL[c] + '</th>'; }).join('') +
      inRange.map(function (q) {
        return '<th class="' + (q.current ? 'today-col' : '') + '">' + esc(q.label) + '</th>';
      }).join('') + '</tr></thead>';

    var totals = { cost: 0, income: 0 };
    var body = groups.map(function (g) {
      var gc = 0, gi = 0, rows = '';
      g.milestones.forEach(function (m) {
        if (!m.from) return; // actual-only spend has no plan, so no bar; the grid has it
        var cost = 0, income = 0;
        inRange.forEach(function (q) {
          var c = m.byQ[q.label];
          if (c) { cost += c.cost.budget; income += c.income.budget; }
        });
        gc += cost; gi += income;
        var status = m.status || g.source.status;
        var fromQi = qiOf(m.from), toQi = qiOf(m.to);
        var cells = inRange.map(function (q) {
          var qi = qiOf(q.label), today = q.current ? ' today-col' : '';
          if (qi < fromQi || qi > toQi) return '<td class="gantt-cell' + today + '"></td>';
          var c = (m.byQ[q.label] || {}).cost || { budget: 0, actual: 0 };
          var tip = q.label + ' · budget ' + money0(c.budget) +
            ((q.past || q.current) ? ' · actual ' + money0(c.actual) : '');
          return '<td class="gantt-cell' + today + '"><div class="gantt-seg seg-' + esc(status) +
            (qi === fromQi ? ' seg-first' : '') + (qi === toQi ? ' seg-last' : '') +
            '"><span class="seg-tip">' + esc(tip) + '</span></div></td>';
        }).join('');
        rows += '<tr><td class="gantt-label">' + esc(m.milestone) + '</td>' +
          figTds(cost, income) + cells + '</tr>';
      });
      if (!rows) return '';
      totals.cost += gc; totals.income += gi;
      return srcRow(g.source, figTds(gc, gi) +
        '<td class="gantt-cell" colspan="' + inRange.length + '"></td>') +
        (trFolded[g.source.source] ? '' : rows);
    }).join('');

    var foot = cols.length
      ? '<tfoot><tr><td>Total</td>' + figTds(totals.cost, totals.income) +
        '<td colspan="' + inRange.length + '"></td></tr></tfoot>'
      : '';
    document.getElementById('tr-grid').innerHTML = body
      ? '<table class="gantt">' + head + '<tbody>' + body + '</tbody>' + foot + '</table>'
      : '<div style="padding:24px;color:var(--muted)">No bars in these quarters: the ' +
        'milestones shown have no budget here.</div>';
    document.getElementById('tr-totals').innerHTML = '';
  }

  function money0(n) { return '$' + Math.round(Number(n) || 0).toLocaleString('en-NZ'); }
  function signed(n) { n = Math.round(n); return (n > 0 ? '+' : '') + money0(n).replace('$-', '-$'); }
  // For cost, spending over budget (positive variance) is bad (red). For income
  // and net, exceeding budget (positive) is good (green) - so invert.
  function varClassM(n, measure) {
    if (n === 0) return '';
    var favourable = (measure === 'cost') ? (n < 0) : (n > 0);
    return favourable ? 'var-neg' : 'var-pos';
  }
  function tot(label, val) { return '<span><span class="lbl">' + label + '</span>' + val + '</span>'; }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

</script>
