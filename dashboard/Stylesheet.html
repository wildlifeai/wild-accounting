<style>
  :root {
    --bg: #ffffff; --bg2: #f5f5f0; --line: rgba(0,0,0,.12);
    --text: #1d1c1a; --muted: #5f5e5a; --hint: #888780;
    --green: #1D9E75; --amber: #EF9F27; --red: #E24B4A;
    --danger-text: #A32D2D; --amber-text: #854F0B;
    /* Runway lines: an ordinal ramp on the secured green. Dark is money in hand; each
       lighter step adds money that is less certain. Validated against the card surface
       with the dataviz palette checker (light end 2.37:1, above the 2:1 floor). */
    --rw-1: #0F6B4D; --rw-2: #1D9E75; --rw-3: #4DBB93;
    /* Runway grouped by project, source or milestone: one line per group. Distinct hues
       at similar weight, none of them the scenario greens, and a grey for "Other". */
    --grp-1: #1F6FB2; --grp-2: #D0661B; --grp-3: #7A4FB8; --grp-4: #B8336A;
    --grp-5: #2C8C8C; --grp-6: #8A6D0B; --grp-7: #5A7F2B; --grp-8: #8A8984;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg2); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 14px; line-height: 1.5; }
  .wrap { margin: 0 auto; padding: 16px 20px 48px; }
  /* Header: tabs, title, refresh. Three columns so the title sits in the middle of the
     page whatever the tabs and the button measure; on a narrow screen the tabs take a
     row of their own underneath. */
  header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    gap: 12px; margin-bottom: 18px; border-bottom: 1px solid var(--line); }
  .title { font-size: 19px; font-weight: 500; display: flex; align-items: center; gap: 8px;
    padding-bottom: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--green); }
  .sync { font-size: 12px; color: var(--hint); display: flex; flex-direction: column;
    align-items: flex-end; gap: 2px; justify-self: end; padding-bottom: 6px; }
  @media (max-width: 1100px) {
    header { grid-template-columns: 1fr auto; }
    header .tabs { grid-column: 1 / -1; grid-row: 2; }
  }
  button { font: inherit; font-size: 13px; background: var(--bg); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button:hover { background: var(--bg2); }
  button:disabled { opacity: .5; cursor: default; }
  h2 { font-size: 14px; font-weight: 500; color: var(--muted); margin: 26px 0 10px; }
  .banner { background: #FCEBEB; color: var(--danger-text); border-radius: 8px;
    padding: 10px 14px; margin-bottom: 16px; font-size: 13px; }
  .banner a { color: var(--danger-text); font-weight: 500; margin-left: 8px; }
  /* Wins over the display a class sets later in this sheet, such as .refresh-progress and
     .badge: without !important those stayed on screen, the progress bar as an empty line
     under the header. */
  .hidden { display: none !important; }

  /* The "?" beside a heading or at the end of a toolbar, and the note it opens. */
  .help { position: relative; display: inline-block; vertical-align: middle; }
  .help-btn { width: 20px; height: 20px; padding: 0; border-radius: 50%; font-size: 12px;
    line-height: 18px; color: var(--muted); }
  .help-btn[aria-expanded="true"] { border-color: var(--green); color: var(--text); }
  .help-pop { position: absolute; left: 0; top: calc(100% + 6px); z-index: 10; width: 380px;
    max-width: 80vw; background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; font-size: 13px; font-weight: 400; line-height: 1.5;
    color: var(--muted); box-shadow: 0 4px 16px rgba(0,0,0,.1); }
  .help-pop.flip { left: auto; right: 0; }
  .help-pop b, .help-pop strong { color: var(--text); font-weight: 500; }

  /* The title over a grid: what the controls chose, so a screenshot of the grid says what
     it is. */
  .grid-title { font-size: 14px; font-weight: 500; margin: 0 0 8px; min-height: 21px; }
  .grid-title-row { display: flex; flex-wrap: wrap; align-items: baseline;
    justify-content: space-between; gap: 6px 16px; }

  /* Planner: the optional Cost / Income / Profit and loss columns sit between the label
     and the month grid, so they stay readable when the Gantt scrolls sideways. */
  .gantt-fig { white-space: nowrap; font-variant-numeric: tabular-nums;
    border-right: 1px solid var(--line); padding-left: 14px; }
  .gantt-fig.pos { color: var(--green); }
  .gantt-fig.neg { color: var(--danger-text); }
  .gantt tfoot td { border-top: 2px solid var(--line); font-weight: 600; }

  /* Count badge on the Health tab. Health sits behind a tab, so this is the only thing
     that says look. */
  .badge { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 6px;
    border-radius: 9px; font-size: 11px; font-weight: 600; line-height: 18px;
    text-align: center; color: #fff; }
  .badge-error { background: var(--red); }
  .badge-warning { background: var(--amber); }

  .fy-select { font: inherit; font-size: 13px; background: var(--bg); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; }

  /* Refresh progress. A refresh is around a minute, almost all of it opening one
     spreadsheet at a time, so the wait has to look bounded rather than broken.
     The slot reserves the height so showing the bar does not shove the page down. */
  .refresh-progress-slot { height: 22px; margin-bottom: 6px; }
  .refresh-progress { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .refresh-bar { flex: 1; height: 6px; background: var(--bg2); border: 1px solid var(--line);
    border-radius: 3px; overflow: hidden; }
  .refresh-bar-fill { height: 100%; width: 0; background: var(--green);
    border-radius: 3px; transition: width .4s ease; }
  .refresh-bar-label { font-size: 12px; color: var(--muted); white-space: nowrap; }

  .overview-section { margin-bottom: 28px; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
  .overview-section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  .overview-section > h2 { font-size: 16px; font-weight: 600; color: var(--text); margin: 0 0 10px 0;
    display: flex; align-items: center; gap: 8px; }

  /* A strip of fixed-width cards, not boxes stretched across the page. */
  .cards { display: flex; flex-wrap: wrap; gap: 10px; }
  .card { background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 16px; min-width: 150px; }
  .card .label { font-size: 12px; color: var(--muted); margin-bottom: 2px; white-space: nowrap; }
  .card .value { font-size: 20px; font-weight: 500; }
  .card .value.danger { color: var(--red); }
  .card .value.amber { color: var(--amber-text); }
  .card .note { font-size: 12px; color: var(--hint); margin-top: 4px; }

  /* Runway chart. Marks are thin, chrome is hairline, and the only loud thing is the data. */
  .rw-wrap { position: relative; background: var(--bg); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px 8px 4px; margin-top: 12px; outline: none; }
  .rw-wrap:focus-visible { box-shadow: 0 0 0 2px var(--green); }
  .rw-wrap svg { display: block; width: 100%; height: auto; font-size: 11px; }
  .rw-axis { fill: var(--hint); }
  .rw-grid { stroke: var(--line); stroke-width: 1; }
  .rw-zero, .rw-today { stroke: rgba(0,0,0,.35); stroke-width: 1; }
  .rw-future { fill: var(--bg2); }
  .rw-line { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .rw-dot { stroke: var(--bg); stroke-width: 2; }
  .rw-cross { fill: var(--bg); stroke: rgba(0,0,0,.45); stroke-width: 1.5; }
  .rw-end { fill: var(--muted); font-size: 12px; }
  .rw-end-sub { fill: var(--hint); font-size: 11px; }
  .rw-end-sub.danger, .rw-net.danger { fill: var(--danger-text); }
  .rw-end-sub.amber { fill: var(--amber-text); }
  .rw-net { fill: var(--muted); }
  .rw-note { font-size: 13px; color: var(--muted); padding: 8px 6px 12px; }
  .rw-tip { position: absolute; pointer-events: none; background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08); min-width: 200px; z-index: 2; }
  .rw-tip .m { font-weight: 500; margin-bottom: 4px; }
  .rw-tip .r { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
  .rw-tip .r b { min-width: 76px; text-align: right; font-variant-numeric: tabular-nums; }
  .rw-tip .k { display: inline-block; width: 14px; height: 2px; border-radius: 1px; }
  .rw-tip .l { color: var(--muted); }
  .rw-table { margin-top: 10px; font-size: 12px; }
  .rw-table summary { cursor: pointer; color: var(--muted); }
  /* Scrolls rather than clips: this table is the chart's accessibility twin, so a
     column hidden at narrow widths would defeat the point. */
  .rw-table .table-wrap { margin-top: 8px; overflow-x: auto; }
  .rw-table td, .rw-table th { padding: 5px 10px; }

  .table-wrap { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--bg); }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 11px 12px; text-align: left; font-size: 13px; }
  thead tr { background: var(--bg2); color: var(--muted); }
  th { font-weight: 500; }
  .num { text-align: right; }
  tbody tr { border-top: 1px solid var(--line); }

  .sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; }
  .sw.ok { background: var(--green); } .sw.warn { background: var(--amber); } .sw.danger { background: var(--red); }
  .muted { color: var(--hint); }
  .flags { margin-top: 18px; font-size: 12px; color: var(--amber-text); }
  .flags div { margin-bottom: 4px; }

  /* Health findings - see docs/HEALTH_CHECKS.md */
  .health-sum { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 8px; }
  .health-row { border-left: 3px solid var(--line); padding: 6px 0 6px 10px;
    margin-bottom: 8px; color: var(--text); }
  .health-error { border-left-color: var(--red); }
  .health-warning { border-left-color: var(--amber); }
  .health-title { font-weight: 600; }
  .health-where { margin-left: 8px; color: var(--hint); }
  .health-amt { margin-left: 8px; color: var(--danger-text); font-variant-numeric: tabular-nums; }
  .health-detail { color: var(--muted); margin-top: 2px; }
  .health-action { color: var(--hint); margin-top: 2px; font-style: italic; }
  .health-link { color: var(--green); text-decoration: none; }
  .health-link:hover { text-decoration: underline; }
  .health-info { color: var(--hint); margin-top: 8px; }
  /* The Xero lines behind a finding. Scrolls rather than clips, as the runway table does. */
  .health-lines { margin-top: 4px; font-size: 12px; }
  .health-lines summary { cursor: pointer; color: var(--muted); }
  .health-lines .table-wrap { margin-top: 6px; overflow-x: auto; }
  .health-lines td, .health-lines th { padding: 5px 10px; font-size: 12px; vertical-align: top; }
  .health-lines td:first-child, .health-lines td.num { white-space: nowrap; }
  .health-lines td.num { font-variant-numeric: tabular-nums; }
  .health-more { color: var(--hint); margin-top: 4px; }

  .coverage { font-size: 13px; color: var(--muted); margin: 0 0 16px; display: flex;
    flex-wrap: wrap; gap: 8px 18px; }

  /* One toolbar per tab: every control on a line, wrapping on a narrow screen. Group by
     sits above the chart on its own, since it changes the chart alone. */
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 22px;
    margin: 0 0 14px; font-size: 13px; }
  .toolbar > label { color: var(--muted); }
  .rw-controls { margin: 0; flex-wrap: wrap; }
  .bd-controls { display: flex; align-items: center; gap: 14px; font-size: 13px; color: var(--text); }
  .bd-controls .bd-label { color: var(--muted); }
  .bd-controls label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
  .bd-controls input { margin: 0; }
  .bd-dd { position: relative; }
  .bd-dd > summary { list-style: none; cursor: pointer; border: 1px solid var(--line);
    border-radius: 8px; padding: 4px 10px; background: var(--bg); color: var(--text); }
  .bd-dd > summary::-webkit-details-marker { display: none; }
  .bd-dd > summary::after { content: " \25BE"; color: var(--hint); }
  .bd-dd[open] > summary { border-color: var(--green); }
  .bd-dd-panel { position: absolute; right: 0; z-index: 10; margin-top: 4px; min-width: 200px;
    max-height: 280px; overflow-y: auto; background: var(--bg); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 10px; box-shadow: 0 4px 16px rgba(0,0,0,.1); }
  .bd-dd.left-aligned .bd-dd-panel { right: auto; left: 0; }
  .bd-dd-actions { display: flex; gap: 12px; margin-bottom: 6px; font-size: 12px; }
  .bd-dd-actions a { color: var(--green); cursor: pointer; }
  .bd-dd-list label { display: flex; align-items: center; gap: 6px; padding: 3px 0;
    font-size: 13px; white-space: nowrap; }

  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: -1px; }
  .tab { border: none; border-bottom: 2px solid transparent; border-radius: 0;
    background: none; color: var(--muted); padding: 10px 12px; }
  .tab:hover { background: none; color: var(--text); }
  .tab.active { color: var(--text); border-bottom-color: var(--green); }

  .measure-toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .measure-toggle .measure { border: none; border-radius: 0; padding: 6px 12px; font-size: 13px;
    background: var(--bg); color: var(--muted); border-left: 1px solid var(--line); }
  .measure-toggle .measure:first-child { border-left: none; }
  .measure-toggle .measure.active { background: var(--green); color: #fff; }
  .measure-toggle .measure:hover:not(.active) { background: var(--bg2); }
  select { font: inherit; font-size: 13px; padding: 6px 10px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--bg); color: var(--text); }
  .track-status { font-size: 12px; color: var(--hint); }
  .track-sheet-links { font-size: 12px; display: inline-flex; flex-wrap: wrap; gap: 8px; }
  .track-sheet-links a { color: var(--green); text-decoration: none; }
  .track-sheet-links a:hover { text-decoration: underline; }
  .cmt-text { font-size: 12px; color: var(--muted); }
  .track-grid-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); }
  #track-grid table, #track-grid-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  #track-grid th, #track-grid td, #track-grid-table th, #track-grid-table td { padding: 8px 10px; text-align: right; white-space: nowrap; }
  #track-grid thead th, #track-grid-table thead th { background: var(--bg2); color: var(--muted); font-weight: 500; }
  #track-grid th.mile, #track-grid td.mile, #track-grid-table th.mile, #track-grid-table td.mile { text-align: left; position: sticky; left: 0;
    background: var(--bg); min-width: 160px; }
  #track-grid thead th.mile, #track-grid-table thead th.mile { background: var(--bg2); }
  #track-grid tbody tr, #track-grid-table tbody tr { border-top: 1px solid var(--line); }
  #track-grid th.cur, #track-grid td.cur, #track-grid-table th.cur, #track-grid-table td.cur { background: rgba(29,158,117,.06); }

  /* Zone header (ACTUAL / FORECAST spanning row) */
  .zone-row th { padding: 6px 10px; font-size: 11px; font-weight: 600; letter-spacing: 0.5px;
    text-align: center; border-bottom: 2px solid var(--line); }
  .zone-actual { background: rgba(29,158,117,.10); color: var(--green); }
  .zone-forecast { background: rgba(239,159,39,.10); color: var(--amber-text); }
  .zone-totals { background: var(--bg2); color: var(--muted); }
  .zone-src { font-weight: 400; font-size: 10px; opacity: 0.7; }

  /* Column tints by zone */
  .col-actual { background: rgba(29,158,117,.04); }
  .col-forecast { background: rgba(239,159,39,.04); }
  .col-current { background: rgba(29,158,117,.10) !important; }
  thead .col-actual { background: rgba(29,158,117,.08); }
  thead .col-forecast { background: rgba(239,159,39,.08); }
  thead .col-current { background: rgba(29,158,117,.14) !important; }
  tfoot .col-actual { background: rgba(29,158,117,.06); }
  tfoot .col-forecast { background: rgba(239,159,39,.06); }
  .cell-actual { color: var(--text); }
  .cell-base { display: block; font-size: 11px; color: var(--hint); margin-top: 2px; }
  .cell-q { display: flex; flex-direction: column; align-items: flex-end; }
  .no-fc { color: var(--hint); font-size: 12px; }
  input.fc { font: inherit; font-size: 13px; width: 84px; text-align: right; padding: 4px 6px;
    border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); }
  input.fc.override { border-color: var(--green); }
  input.fc:focus { outline: 2px solid var(--green); outline-offset: -1px; }
  #track-grid th.agg, #track-grid td.agg, #track-grid-table th.agg, #track-grid-table td.agg { background: rgba(0,0,0,.03); }
  #track-grid th.cmt-h, #track-grid td.cmt-c, #track-grid-table th.cmt-h, #track-grid-table td.cmt-c { text-align: left; min-width: 180px; }
  input.cmt { font: inherit; font-size: 12px; width: 100%; min-width: 160px; padding: 4px 6px;
    border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); }
  input.cmt:focus { outline: 2px solid var(--green); outline-offset: -1px; }
  .var-pos { color: var(--red); }
  .var-neg { color: var(--green); }
  td.tot, th.tot { font-weight: 500; border-left: 1px solid var(--line); }
  #track-grid tfoot td, #track-grid-table tfoot td { border-top: 2px solid var(--line); font-weight: 500; background: var(--bg2); }
  .track-totals { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 14px; font-size: 13px; }
  .track-totals .lbl { color: var(--muted); margin-right: 6px; }

  /* ---- Project planner (Gantt) ------------------------------------------ */
  .planner-link { font-size: 13px; color: var(--green); text-decoration: none; }
  .planner-link:hover { text-decoration: underline; }
  .planner-legend { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 8px;
    font-size: 11px; color: var(--hint); }

  .planner-grid { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px;
    background: var(--bg); }
  .gantt { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 900px; }
  .gantt th, .gantt td { padding: 0; text-align: center; }
  .gantt thead th { background: var(--bg2); color: var(--muted); font-weight: 500;
    font-size: 11px; padding: 8px 0; border-left: 1px solid var(--line); white-space: nowrap; }
  .gantt thead th:first-child { border-left: none; text-align: left; padding-left: 12px; }
  .gantt thead th.today-col { background: rgba(29,158,117,.1); }

  .gantt tbody tr { border-top: 1px solid var(--line); }
  .gantt td.gantt-label { text-align: left; padding: 10px 12px; min-width: 170px; max-width: 220px;
    position: sticky; left: 0; background: var(--bg); z-index: 2; font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gantt td.gantt-label .gantt-sub { display: block; font-weight: 400; font-size: 11px;
    color: var(--muted); margin-top: 2px; }

  .gantt td.gantt-cell { padding: 8px 0; border-left: 1px solid var(--line);
    position: relative; height: 44px; vertical-align: middle; }
  .gantt td.gantt-cell.today-col { background: rgba(29,158,117,.05); }

  .gantt-seg { position: absolute; top: 8px; bottom: 8px; border-radius: 4px;
    min-width: 2px; display: flex; align-items: center; justify-content: center;
    font-size: 10px; color: #fff; font-weight: 500; overflow: hidden;
    white-space: nowrap; cursor: default; z-index: 1; }
  .gantt-seg.seg-secured { background: var(--green); }
  .gantt-seg.seg-proposed { background: var(--amber); }

  .gantt-seg .seg-tip { display: none; position: absolute; bottom: calc(100% + 6px); left: 50%;
    transform: translateX(-50%); background: var(--text); color: #fff; padding: 6px 10px;
    border-radius: 6px; font-size: 11px; font-weight: 400; white-space: nowrap;
    z-index: 20; pointer-events: none; box-shadow: 0 4px 12px rgba(0,0,0,.2); }
  .gantt-seg:hover .seg-tip { display: block; }

  .gantt tfoot td { border-top: 2px solid var(--line); font-weight: 500;
    background: var(--bg2); padding: 10px 12px; text-align: left; font-size: 12px; color: var(--muted); }
</style>
